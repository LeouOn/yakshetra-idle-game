# CI: lint, typecheck, unit tests, and axe-core accessibility audit.
# Runs on every push and pull request to main. No secrets required.
# Required secrets: none.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, typecheck, test, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Accessibility audit (axe-core)
        run: pnpm vitest run src/a11y

      - name: Plan compliance audit (F1)
        run: node scripts/audit-plan.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: |
            coverage
            *.log
          if-no-files-found: ignore
          retention-days: 7
